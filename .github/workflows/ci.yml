name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: smoke test built CLI on Node
        run: |
          node dist/cli.js --version
          JUST_USAGE_NO_UPDATE_CHECK=1 node dist/cli.js status --json | head -c 400
